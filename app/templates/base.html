<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Grasse{% endblock %} · Fragrance tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% set path = request.url.path %}
  <header class="topbar">
    <div class="wrap">
      <a class="logo" href="/"><span class="logo-mark">✦</span><span>Grasse</span></a>
      <nav class="tabs">
        <a href="/" class="{{ 'active' if path == '/' }}">Changes</a>
        <a href="/stock" class="{{ 'active' if path.startswith('/stock') }}">Stock</a>
        <a href="/orders" class="{{ 'active' if path.startswith('/orders') }}">Orders</a>
        <a href="/brands" class="{{ 'active' if path.startswith('/brands') }}">Brands</a>
        <a href="/products" class="{{ 'active' if path.startswith('/products') }}">Products</a>
        <a href="/merges" class="{{ 'active' if path.startswith('/merges') }}">Merges</a>
        <a href="/suppliers" class="{{ 'active' if path.startswith('/suppliers') }}">Suppliers</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

# Streams every change to the database to R2 within a second or so, and keeps snapshots so
# a fresh server can restore it (docker/entrypoint.sh).
dbs:
  - path: /data/fragrance.db
    replicas:
      - type: s3
        endpoint: https://${BACKUP_R2_ACCOUNT_ID}.r2.cloudflarestorage.com
        bucket: ${BACKUP_R2_BUCKET}
        path: fragrance.db
        region: auto
        access-key-id: ${BACKUP_R2_ACCESS_KEY_ID}
        secret-access-key: ${BACKUP_R2_SECRET_ACCESS_KEY}
        retention: 720h  # keep 30 days of history to restore from

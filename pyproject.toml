[project]
name = "fragrance"
version = "0.1.0"
description = "Tracks B2B supplier stock and sends Telegram alerts"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "jinja2==3.1.5",
    "openpyxl==3.1.5",
    "python-multipart==0.0.31",
    "uvicorn==0.34.0",
]

[project.scripts]
fragrance = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
